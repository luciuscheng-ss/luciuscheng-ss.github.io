  --popover-foreground: var(

  );
  --primary: var(
    --color-text-info,

  );
  --primary-foreground: var(

  );

  );

  --muted-foreground: var(

  );
  --accent: var(
    --color-background-info,
    light-dark(rgb(229 242 255), rgb(13 39 63))
  );
  --accent-foreground: var(
    --color-text-info,
    light-dark(rgb(51 156 255), rgb(131 195 255))
  );
  --destructive: var(
    --color-text-warning,
    light-dark(rgb(226 85 7), rgb(255 133 73))
  );
  --border: var(
    --color-border-secondary,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );
  --input: var(
    --color-border-primary,
    light-dark(
      rgb(26 28 31 / 11.8%),
      color-mix(in oklab, rgb(0 0 0) 10%, transparent)
    )
  );
  --ring: var(
    --color-ring-primary,
    light-dark(rgb(51 156 255), rgb(131 195 255 / 76%))
  );
  --font-size-base: var(--font-text-md-size, 14px);
  --blue: light-dark(rgb(51 156 255), rgb(51 156 255));
  --orange: light-dark(rgb(226 85 7), rgb(251 106 34));
  --green: light-dark(rgb(0 162 64), rgb(64 201 119));
  --red: light-dark(rgb(224 46 42), rgb(255 103 100));
  --purple: light-dark(rgb(146 79 247), rgb(173 123 249));
  --yellow: light-dark(rgb(255 195 0), rgb(255 210 64));
  --viz-series-1: var(--primary);

  --viz-series-3: light-dark(rgb(93 201 119), rgb(116 213 139));
  --viz-series-4: light-dark(rgb(235 119 177), rgb(240 143 192));
  --viz-series-5: light-dark(rgb(155 121 236), rgb(170 145 239));
  --viz-series-6: light-dark(rgb(58 185 177), rgb(90 203 194));

  /* Internal implementation variables; not part of the agent contract. */
  --font-sans: -apple-system, system-ui, "Segoe UI", sans-serif;
  --font-mono:
    ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono",
    monospace;
  --font-size-normal: max(11px, var(--font-size-base));
  --font-size-tooltip: calc(var(--font-size-base) - 1px);
  --font-size-small: max(11px, calc(var(--font-size-base) - 2px));
  --font-size-h1: calc(var(--font-size-normal) * 1.7142857143);
  --font-size-h2: calc(var(--font-size-normal) * 1.4285714286);
  --font-size-h3: calc(var(--font-size-normal) * 1.2857142857);
  --font-weight-normal: 430;
  --font-weight-medium: 500;
  --icon-size: 16px;
  --line-height-normal: calc(var(--font-size-normal) * 1.5);
  --line-height-tooltip: calc(var(--font-size-tooltip) * 1.4285714286);
  --line-height-small: calc(var(--font-size-small) + 4px);
  --corner-shape: round;
  --radius: var(--border-radius-lg, 10px);
  --radius-sm: calc(var(--radius) * 0.6);
  --radius-md: calc(var(--radius) * 0.8);
  --radius-lg: var(--radius);
  --radius-2xl: calc(var(--radius) * 1.6);
  --radius-full: 9999px;

  /* Legacy aliases; not part of the current agent contract. */

  --viz-accent: var(--primary);
  --viz-accent-text: var(--primary-foreground);
  --viz-accent-bg: var(--accent);

  --viz-warning: var(--destructive);

:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html > body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: var(--visualize-paint-gutter, 0px);
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align="right"]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align="center"]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

#widget > :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {
  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls > .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls > .form-label > :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover,
.nav-link:not(:disabled):not([aria-disabled="true"]):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);
}

.btn:disabled,
.nav-link:disabled,
.nav-link[aria-disabled="true"] {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type="file"] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type="file"]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type="file"]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type="color"] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type="color"]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type="checkbox"]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: "";
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type="radio"] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type="radio"]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed="true"],
  [aria-selected="true"],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {

  .form-control,
  .form-select {

  }

  }

  .form-control-color[type="color"] {

    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;

    height: 44px;

    import('./vendor/three/examples/jsm/postprocessing/UnrealBloomPass.js'),
    import('./vendor/three/examples/jsm/postprocessing/OutputPass.js')
  ]);
  const spec = JSON.parse(document.getElementById('eiffel-model-spec').textContent);
  const stage = root.querySelector('.eiffel-stage');
  const canvas = root.querySelector('canvas');
  const scene = new THREE.Scene();
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true, preserveDrawingBuffer:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000,0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  const camera = new THREE.PerspectiveCamera(32,1,0.1,3000);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(736,620),0.32,0.5,1.15);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
  const tower = new THREE.Group();
  scene.add(tower);
  const materials = spec.materials.map(m => new THREE.MeshStandardMaterial({
    color:m.color, metalness:m.metalness, roughness:m.roughness,
    side:THREE.FrontSide
  }));
  const box = new THREE.BoxGeometry(1,1,1);
  const scratch = new THREE.Object3D();
  materials.forEach((material,materialIndex) => {
    const parts = spec.parts.filter(p => p[10] === materialIndex);
    if(!parts.length) return;
    const mesh = new THREE.InstancedMesh(box,material,parts.length);
    mesh.name = spec.materials[materialIndex].name;
    parts.forEach((p,i) => {
      scratch.position.set(p[0],p[1],p[2]);
      scratch.scale.set(p[3],p[4],p[5]);
      scratch.quaternion.set(p[6],p[7],p[8],p[9]).normalize();
      scratch.updateMatrix();
      mesh.setMatrixAt(i,scratch.matrix);
    });
    mesh.instanceMatrix.needsUpdate = true;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.computeBoundingSphere();
    tower.add(mesh);
  });
  const hemi = new THREE.HemisphereLight(0xb7d2ef,0x302619,0.55);
  scene.add(hemi);
  const key = new THREE.DirectionalLight(0xffecd6,3.0);
  key.position.set(-180,350,210);
  key.target.position.set(0,130,0);
  key.castShadow = true;
  const shadowSize=window.matchMedia('(max-width:600px)').matches?2048:4096;
  key.shadow.mapSize.set(shadowSize,shadowSize);
  Object.assign(key.shadow.camera,{left:-215,right:215,top:225,bottom:-225,near:1,far:1250});
  key.shadow.camera.updateProjectionMatrix();
  key.shadow.bias = -0.00008;
  key.shadow.normalBias = 0.045;
  key.shadow.radius = 2;
  scene.add(key,key.target);
  const rim = new THREE.DirectionalLight(0x7ba7ff,1.3);
  rim.position.set(120,200,-180);
  scene.add(rim);
  const fill = new THREE.DirectionalLight(0xffe4c4,0.2);
  fill.position.set(120,100,200);
  scene.add(fill);

  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0x344454);
  const panels = [
    [-3,4,3,4,7,4,0xffe4bb,2.1],
    [4,2,-4,3,5,4,0x8bbcff,1.4],
    [0,-4,0,12,1,12,0x453123,0.4]
  ];
  panels.forEach(p => {
    const panel = new THREE.Mesh(new THREE.BoxGeometry(p[3],p[4],p[5]),new THREE.MeshBasicMaterial({color:p[6]}));
    panel.material.color.multiplyScalar(p[7]);
    panel.position.set(p[0],p[1],p[2]);
    envScene.add(panel);
  });
  const pmrem = new THREE.PMREMGenerator(renderer);
  const environment = pmrem.fromScene(envScene,0.06);
  scene.environment = environment.texture;
  materials.forEach(m => m.envMapIntensity = 0.65);
  pmrem.dispose();

  const floorMaterial = new THREE.MeshStandardMaterial({roughness:0.44,metalness:0.24});
  const floor = new THREE.Mesh(new THREE.CylinderGeometry(118,118,1.2,96),floorMaterial);
  floor.position.y = -1.1;
  floor.receiveShadow = true;
  scene.add(floor);
  const grid = new THREE.GridHelper(148,14);
  grid.position.y = -0.62;
  grid.material.transparent = true;
  grid.material.opacity = 0.13;
  scene.add(grid);

  // Architectural floodlights point upward through each lattice section.
  const floodlights=[];
  for(const [y,offset,aimY,aimOffset,power] of [[3,58,64,30,20000],[59,33,130,16,16000],[118,19,224,8,22000]]) {
    for(const sx of [-1,1]) for(const sz of [-1,1]) {
      const light=new THREE.SpotLight(0xffaa45,power,210,Math.PI/7,0.8,2);
      light.position.set(sx*offset,y,sz*offset);
      light.target.position.set(sx*aimOffset,aimY,sz*aimOffset);
      light.userData.power=power;
      scene.add(light,light.target);
      floodlights.push(light);
    }
  }
  const jewelMaterial=new THREE.MeshBasicMaterial({color:new THREE.Color(0xffbf72).multiplyScalar(4.5),toneMapped:false});
  const lightParts=spec.parts.filter((p,i)=>p[10]===0 && p[1]>5 && p[1]<279 && i%3===0);
  const jewels=new THREE.InstancedMesh(new THREE.SphereGeometry(0.30,6,4),jewelMaterial,lightParts.length);
  lightParts.forEach((p,i)=>{
    scratch.position.set(p[0],p[1],p[2]);
    scratch.scale.setScalar(1);
    scratch.quaternion.identity();
    scratch.updateMatrix();
    jewels.setMatrixAt(i,scratch.matrix);
  });
  jewels.instanceMatrix.needsUpdate=true;
  scene.add(jewels);
  const lightingPresets={
    day:{sky:0xb9c9d8,floor:0xaab0b5,sun:0xfff0d5,key:3.4,hemi:1.15,rim:0.45,fill:0.22,env:0.42,exposure:1.1,elevation:0.95,bloom:0.08,flood:0,emission:0},
    sunset:{sky:0x1b2739,floor:0x293543,sun:0xffb262,key:4.6,hemi:0.4,rim:1.55,fill:0.12,env:0.38,exposure:1.17,elevation:0.51,bloom:0.30,flood:0.15,emission:0.035},
    night:{sky:0x070e1b,floor:0x141e2d,sun:0x80a7e9,key:0.46,hemi:0.14,rim:0.95,fill:0.08,env:0.19,exposure:1.2,elevation:0.72,bloom:0.62,flood:1,emission:0.18}
  };
  let lightingMode='sunset';

  const state = {theta:0.56,phi:1.36,zoom:1,targetY:156,view:'perspective'};
  const target = new THREE.Vector3();
  let width = 736, height = 620, queued = false;
  function updateCamera() {
    const extent = state.view === 'top' ? 116 : 195;
    const vdist = extent / Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
    const hdist = (state.view === 'top' ? 116 : 98) / (Math.tan(THREE.MathUtils.degToRad(camera.fov/2)) * camera.aspect);
    const distance = Math.max(vdist,hdist)/state.zoom;
    target.set(0,state.targetY,0);
    camera.position.set(
      distance*Math.sin(state.phi)*Math.sin(state.theta),
      target.y+distance*Math.cos(state.phi),
      distance*Math.sin(state.phi)*Math.cos(state.theta)
    );
    camera.lookAt(target);
    camera.updateMatrixWorld();
  }
  function render() {
    queued=false;
    updateCamera();
    composer.render();
  }
  function invalidate() {
    if(!queued) { queued=true; requestAnimationFrame(render); }
  }
  function resize() {
    width=stage.clientWidth;
    height=stage.clientHeight;
    if(width<1 || height<1) return;
    renderer.setSize(width,height,false);
    composer.setSize(width,height);
    camera.aspect=width/height;
    camera.updateProjectionMatrix();
    invalidate();
  }
  function cssColor(token) {
    const probe=document.createElement('span');
    probe.hidden=true;
    root.append(probe);
    const swatch=document.createElement('canvas');
    swatch.width=swatch.height=1;
    const ctx=swatch.getContext('2d',{willReadFrequently:true});
    probe.style.color='var(--background)';
    ctx.fillStyle=getComputedStyle(probe).color;
    ctx.fillRect(0,0,1,1);
    probe.style.color=`var(${token})`;
    ctx.fillStyle=getComputedStyle(probe).color;
    ctx.fillRect(0,0,1,1);
    const pixel=ctx.getImageData(0,0,1,1).data;
    probe.remove();
    return new THREE.Color().setRGB(pixel[0]/255,pixel[1]/255,pixel[2]/255,THREE.SRGBColorSpace);
  }
  function theme() {
    const background=new THREE.Color(cssColor('--background'));
    const foreground=new THREE.Color(cssColor('--foreground'));
    const dark=background.r+background.g+background.b < 0.7;
    grid.material.color.copy(foreground);
    invalidate();
  }
  function updateLighting() {
    const preset=lightingPresets[lightingMode];
    const angle=Number(root.querySelector('[data-sun-angle]').value);
    const azimuth=THREE.MathUtils.degToRad(angle);
    const distance=700;
    scene.background=new THREE.Color(preset.sky);
    if(document.documentElement.hasAttribute('data-eiffel-site')) {
      document.documentElement.style.colorScheme=lightingMode==='day'?'light':'dark';
      document.documentElement.style.setProperty('--background','#'+preset.sky.toString(16).padStart(6,'0'));
    }
    floorMaterial.color.setHex(preset.floor);
    key.color.setHex(preset.sun);
    key.intensity=preset.key;
    key.position.set(Math.sin(azimuth)*Math.cos(preset.elevation)*distance,130+Math.sin(preset.elevation)*distance,Math.cos(azimuth)*Math.cos(preset.elevation)*distance);
    hemi.intensity=preset.hemi;
    rim.intensity=preset.rim;
    fill.intensity=preset.fill;
    materials.forEach((m,i)=>{
      m.envMapIntensity=preset.env;
      m.emissive.setHex(i===6?0x92c7e1:0xffa244);
      m.emissiveIntensity=i===6?preset.emission*3:preset.emission;
    });
    floodlights.forEach(light=>light.intensity=light.userData.power*preset.flood);
    jewels.visible=lightingMode!=='day';
    jewelMaterial.color.setHex(0xffbf72).multiplyScalar(lightingMode==='night'?4.5:1.5);
    bloom.strength=preset.bloom;
    renderer.toneMappingExposure=preset.exposure;
    renderer.shadowMap.needsUpdate=true;
    root.querySelector('[data-angle]').textContent=`${angle}°`;
    root.dataset.lighting=lightingMode;
    invalidate();
  }
  root.querySelector('[data-lighting]').addEventListener('change',e=>{
    lightingMode=e.target.value;
    updateLighting();
    root.querySelector('[data-state]').textContent=e.target.selectedOptions[0].textContent;
  });
  root.querySelector('[data-sun-angle]').addEventListener('input',updateLighting);
  new ResizeObserver(resize).observe(stage);
  new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
  const pointers=new Map();
  let gesture=null;
  const viewSelect=root.querySelector('[data-view]');
  function beginGesture() {
    const pts=[...pointers.values()];
    if(pts.length===1) gesture={x:pts[0].x,y:pts[0].y,theta:state.theta,phi:state.phi};
    else if(pts.length>=2) gesture={distance:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),zoom:state.zoom};
    else gesture=null;
  }
  canvas.addEventListener('pointerdown',e => {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    beginGesture();
  });
  canvas.addEventListener('pointermove',e => {
    if(!pointers.has(e.pointerId) || !gesture) return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const pts=[...pointers.values()];
    if(pts.length===1 && gesture.theta!==undefined) {
      if(state.view!=='perspective') {
        if(state.view==='top') { gesture.phi=0.15; state.zoom=1; }
        state.view='perspective';
        state.targetY=156;
        viewSelect.value='perspective';
      }
      state.theta=gesture.theta-(e.clientX-gesture.x)*0.008;
      state.phi=THREE.MathUtils.clamp(gesture.phi-(e.clientY-gesture.y)*0.006,0.12,1.69);
    } else if(pts.length>=2 && gesture.distance>0) {
      state.zoom=THREE.MathUtils.clamp(gesture.zoom*Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)/gesture.distance,0.6,4.5);
    }
    invalidate();
  });
  const endPointer=e=>{pointers.delete(e.pointerId);beginGesture();};
  canvas.addEventListener('pointerup',endPointer);
  canvas.addEventListener('pointercancel',endPointer);
  canvas.addEventListener('lostpointercapture',endPointer);
  canvas.addEventListener('keydown',e=>{
    if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) return;
    e.preventDefault();
    if(state.view==='top') Object.assign(state,{phi:0.15,zoom:1});
    state.view='perspective'; state.targetY=156; viewSelect.value='perspective';
    if(e.key==='ArrowLeft') state.theta-=0.10;
    if(e.key==='ArrowRight') state.theta+=0.10;
    if(e.key==='ArrowUp') state.phi-=0.07;
    if(e.key==='ArrowDown') state.phi+=0.07;
    state.phi=THREE.MathUtils.clamp(state.phi,0.12,1.69);
    invalidate();
  });
  function zoomBy(factor) {
    state.zoom=THREE.MathUtils.clamp(state.zoom*factor,0.6,4.5);
    invalidate();
    root.querySelector('[data-state]').textContent=`缩放 ${Math.round(state.zoom*100)}%`;
  }
  canvas.addEventListener('wheel',e=>{e.preventDefault();zoomBy(Math.exp(-THREE.MathUtils.clamp(e.deltaY,-100,100)*0.0015));},{passive:false});
  root.querySelector('[data-zoom="in"]').addEventListener('click',()=>zoomBy(1.25));
  root.querySelector('[data-zoom="out"]').addEventListener('click',()=>zoomBy(0.8));
  viewSelect.addEventListener('change',()=>{
    state.view=viewSelect.value;
    state.zoom=1;
    if(state.view==='front') Object.assign(state,{theta:0,phi:Math.PI/2,targetY:157});
    else if(state.view==='top') Object.assign(state,{theta:0.60,phi:0.01,targetY:20});
    else Object.assign(state,{theta:0.56,phi:1.36,targetY:156});
    invalidate();
  });
  root.querySelector('[data-wire]').addEventListener('click',e=>{
    const enabled=e.currentTarget.getAttribute('aria-pressed')!=='true';
    e.currentTarget.setAttribute('aria-pressed',String(enabled));
    materials.forEach(m=>{m.wireframe=enabled;});
    invalidate();
  });
  theme();
  updateLighting();
  resize();
  render();
  loading.hidden=true;
  root.dataset.ready='true';
  root.dataset.members=String(spec.parts.length);
  canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();loading.hidden=false;loading.textContent='三维显示已暂停，请重新打开预览。';});
} catch(error) {
  loading.textContent='三维预览暂时无法载入，请下载 GLB 模型文件查看。';
  loading.setAttribute('role','alert');
  root.dataset.error=String(error);
  console.error(error);
}
</script>

</main>
<noscript>请启用 JavaScript 查看三维模型，或使用上方链接下载模型。</noscript>
